[package]
name = "autonomic_launcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
