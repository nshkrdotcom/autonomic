name: Privileged Linux acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    # Deliberately requires an operator-controlled runner with writable cgroup v2,
    # sudo permission for the exact launcher, PostgreSQL, and the configured rootfs.
    runs-on: [self-hosted, linux, x64, autonomic-privileged]
    env:
      MIX_ENV: test
      AUTONOMIC_LINUX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/preflight.sh
      - run: bash scripts/build_launcher.sh
      - name: Linux Isolation Tests
        run: |
          cd packages/autonomic_linux
          mix deps.get
          mix test test/integration --include linux
      - name: PostgreSQL Migrations
        run: |
          cd packages/autonomic_postgres
          mix deps.get
          mix ecto.migrate -r Autonomic.Store.Repo
      - name: Coding Agent Acceptance Scenario
        run: |
          cd integration/autonomic_acceptance
          mix deps.get
          mix test test/coding_agent_test.exs --include reference --include postgres --include linux
      - name: Database Outage Gate
        run: bash scripts/run_db_outage_gate.sh
      - name: Full Strict Monorepo QC
        run: python3 scripts/qc.py --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomic-conformance
          path: artifacts/
          if-no-files-found: error
