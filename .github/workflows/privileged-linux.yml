name: Privileged Linux acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    # Deliberately requires an operator-controlled runner with writable cgroup v2,
    # sudo permission for the exact launcher, PostgreSQL, and the configured rootfs.
    runs-on: [self-hosted, linux, x64, autonomic-privileged]
    env:
      MIX_ENV: test
      AUTONOMIC_LINUX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/preflight.sh
      - run: mix deps.get
      - run: bash scripts/build_launcher.sh
      - run: mix ecto.migrate -r Autonomic.Store.Repo
      - run: mix test apps/autonomic_linux/test/integration --include linux
      - run: mix test apps/autonomic_store/test/reference/coding_agent_test.exs --include reference --include postgres --include linux
      - run: bash scripts/run_db_outage_gate.sh
      - run: python3 scripts/qc.py --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomic-conformance
          path: artifacts/
          if-no-files-found: error
