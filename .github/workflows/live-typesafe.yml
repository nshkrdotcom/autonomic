name: Live TypeSafe gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    if: vars.TYPESAFE_LIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0.6'
      - run: test -n "$TYPESAFE_API_KEY"
      - run: mix deps.get
      - run: mix test apps/autonomic_typesafe/test/live_gate_test.exs --include live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typesafe-live-provenance
          path: artifacts/typesafe_live_gate.json
          if-no-files-found: error
