<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pgBgGrad" x1="100" y1="8" x2="100" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="45%" stop-color="#040D1A" />
      <stop offset="100%" stop-color="#02060D" />
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="pgRimGrad" x1="20" y1="8" x2="180" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="30%" stop-color="#336791" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Inner Core Ambient Glow -->
    <radialGradient id="pgCoreGlow" cx="100" cy="100" r="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#336791" stop-opacity="0.18" />
      <stop offset="75%" stop-color="#F59E0B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#040D1A" stop-opacity="0" />
    </radialGradient>

    <!-- Nucleus Radial Glow -->
    <radialGradient id="pgNucleusGlow" cx="100" cy="100" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>

    <!-- Platter Gradients -->
    <linearGradient id="platterGradTop" x1="60" y1="65" x2="140" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="50%" stop-color="#0E2338" />
      <stop offset="100%" stop-color="#091827" />
    </linearGradient>

    <linearGradient id="platterGradBottom" x1="60" y1="105" x2="140" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="50%" stop-color="#0E2338" />
      <stop offset="100%" stop-color="#091827" />
    </linearGradient>

    <!-- Clip Path for the Hexagon -->
    <clipPath id="pgHexClip">
      <path d="M 94.00,11.46 A 12.00 12.00 0 0 1 106.00,11.46 L 173.67,50.54 A 12.00 12.00 0 0 1 179.67,60.93 L 179.67,139.07 A 12.00 12.00 0 0 1 173.67,149.46 L 106.00,188.54 A 12.00 12.00 0 0 1 94.00,188.54 L 26.33,149.46 A 12.00 12.00 0 0 1 20.33,139.07 L 20.33,60.93 A 12.00 12.00 0 0 1 26.33,50.54 Z" />
    </clipPath>

    <!-- Glow Filters -->
    <filter id="pgSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pgIntenseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. BASE HEXAGON (Transparent Outside) -->
  <path d="M 94.00,11.46 A 12.00 12.00 0 0 1 106.00,11.46 L 173.67,50.54 A 12.00 12.00 0 0 1 179.67,60.93 L 179.67,139.07 A 12.00 12.00 0 0 1 173.67,149.46 L 106.00,188.54 A 12.00 12.00 0 0 1 94.00,188.54 L 26.33,149.46 A 12.00 12.00 0 0 1 20.33,139.07 L 20.33,60.93 A 12.00 12.00 0 0 1 26.33,50.54 Z" fill="url(#pgBgGrad)" />

  <!-- Clipped internal elements -->
  <g clip-path="url(#pgHexClip)">
    <!-- Radial Ambient Atmosphere -->
    <circle cx="100" cy="100" r="85" fill="url(#pgCoreGlow)" />

    <!-- Ledger Transaction Coordinates & Hash Mesh -->
    <g opacity="0.18" stroke="#38BDF8" stroke-width="0.75">
      <line x1="100" y1="15" x2="100" y2="185" stroke-dasharray="2 4" />
      <line x1="26" y1="57" x2="174" y2="143" stroke-dasharray="2 4" />
      <line x1="26" y1="143" x2="174" y2="57" stroke-dasharray="2 4" />
      <circle cx="100" cy="100" r="76" fill="none" />
      <circle cx="100" cy="100" r="62" fill="none" stroke-dasharray="1 5" />
    </g>

    <!-- 2. CAS EPOCH FENCING PERIMETER RING -->
    <path d="M 96.00,21.00 A 8.00 8.00 0 0 1 104.00,21.00 L 166.00,56.80 A 8.00 8.00 0 0 1 170.00,63.70 L 170.00,136.30 A 8.00 8.00 0 0 1 166.00,143.20 L 104.00,179.00 A 8.00 8.00 0 0 1 96.00,179.00 L 34.00,143.20 A 8.00 8.00 0 0 1 30.00,136.30 L 30.00,63.70 A 8.00 8.00 0 0 1 34.00,56.80 Z" fill="none" stroke="#1E3A8A" stroke-width="1.5" />
    <path d="M 96.00,21.00 A 8.00 8.00 0 0 1 104.00,21.00 L 166.00,56.80 A 8.00 8.00 0 0 1 170.00,63.70 L 170.00,136.30 A 8.00 8.00 0 0 1 166.00,143.20 L 104.00,179.00 A 8.00 8.00 0 0 1 96.00,179.00 L 34.00,143.20 A 8.00 8.00 0 0 1 30.00,136.30 L 30.00,63.70 A 8.00 8.00 0 0 1 34.00,56.80 Z" fill="none" stroke="url(#pgRimGrad)" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="12 6" />

    <!-- Epoch CAS Gear Teeth / Vault Notches (Surrounding perimeter) -->
    <g stroke="#F59E0B" stroke-width="1.2" opacity="0.75">
      <line x1="100" y1="21" x2="100" y2="28" />
      <line x1="100" y1="172" x2="100" y2="179" />
      <line x1="33" y1="62" x2="39" y2="65" />
      <line x1="167" y1="62" x2="161" y2="65" />
      <line x1="33" y1="138" x2="39" y2="135" />
      <line x1="167" y1="138" x2="161" y2="135" />
    </g>

    <!-- 3. TRANSACTIONAL LEDGER WAL BLOCKS (Left & Right sidechains) -->
    <g fill="#0B1E3B" stroke="#38BDF8" stroke-width="1.2">
      <!-- Left sidechain block 1 -->
      <polygon points="40,75 52,68 52,82 40,89" />
      <!-- Left sidechain block 2 -->
      <polygon points="40,111 52,118 52,132 40,125" />
      <!-- Right sidechain block 1 -->
      <polygon points="160,75 148,68 148,82 160,89" />
      <!-- Right sidechain block 2 -->
      <polygon points="160,111 148,118 148,132 160,125" />
    </g>
    <!-- Sidechain Block Hash Connectors -->
    <g stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="2 3">
      <line x1="52" y1="75" x2="72" y2="85" />
      <line x1="52" y1="125" x2="72" y2="115" />
      <line x1="148" y1="75" x2="128" y2="85" />
      <line x1="148" y1="125" x2="128" y2="115" />
    </g>

    <!-- 4. DURABLE AUTHORITY STORAGE PLATTERS (3-Tier PostgreSQL Cylinders) -->
    <!-- Lower Platter / Table Partition Tier -->
    <g stroke="#0284C7" stroke-width="1.2">
      <path d="M 64,124 C 64,136 136,136 136,124 L 136,134 C 136,146 64,146 64,134 Z" fill="url(#platterGradBottom)" />
      <ellipse cx="100" cy="124" rx="36" ry="10" fill="#0C2340" stroke="#38BDF8" stroke-width="1.4" />
    </g>
    <!-- Middle Platter / Transaction Ledger Tier -->
    <g stroke="#0284C7" stroke-width="1.2">
      <path d="M 64,98 C 64,110 136,110 136,98 L 136,108 C 136,120 64,120 64,108 Z" fill="url(#platterGradTop)" />
      <ellipse cx="100" cy="98" rx="36" ry="10" fill="#0E2D52" stroke="#60A5FA" stroke-width="1.4" />
    </g>
    <!-- Upper Platter / Authoritative State Head Tier -->
    <g stroke="#38BDF8" stroke-width="1.2">
      <path d="M 64,72 C 64,84 136,84 136,72 L 136,82 C 136,94 64,94 64,82 Z" fill="url(#platterGradTop)" />
      <ellipse cx="100" cy="72" rx="36" ry="10" fill="#133A6B" stroke="#38BDF8" stroke-width="1.5" />
    </g>

    <!-- Platter Concentric Track Grooves & Sector Marks -->
    <g stroke="#38BDF8" stroke-width="0.8" opacity="0.6">
      <ellipse cx="100" cy="72" rx="26" ry="7" fill="none" stroke-dasharray="3 3" />
      <ellipse cx="100" cy="72" rx="15" ry="4" fill="none" />
      <line x1="88" y1="72" x2="94" y2="72" stroke="#FCD34D" stroke-width="1.5" />
      <line x1="106" y1="72" x2="112" y2="72" stroke="#FCD34D" stroke-width="1.5" />
    </g>

    <!-- 5. CENTRAL CAS EPOCH LOCK & AUTHORITY VAULT -->
    <!-- Vault Hexagonal Core Ring -->
    <polygon points="100,82 116,91 116,109 100,118 84,109 84,91" fill="#041226" stroke="#F59E0B" stroke-width="1.8" />

    <!-- Radiant Epoch Nucleus (Durable Authority Engine) -->
    <circle cx="100" cy="100" r="13" fill="url(#pgNucleusGlow)" filter="url(#pgIntenseGlow)" />
    <circle cx="100" cy="100" r="7" fill="#FFFFFF" />
    <circle cx="100" cy="100" r="3.5" fill="#D97706" />

    <!-- Epoch Vector Compass / Authority Teeth -->
    <g stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round">
      <line x1="100" y1="84" x2="100" y2="78" />
      <line x1="100" y1="116" x2="100" y2="122" />
      <line x1="85" y1="92" x2="80" y2="89" />
      <line x1="115" y1="92" x2="120" y2="89" />
      <line x1="85" y1="108" x2="80" y2="111" />
      <line x1="115" y1="108" x2="120" y2="111" />
    </g>
  </g>

  <!-- 6. OUTER HEXAGON RIM & CORNER ACCENTS -->
  <path d="M 94.00,11.46 A 12.00 12.00 0 0 1 106.00,11.46 L 173.67,50.54 A 12.00 12.00 0 0 1 179.67,60.93 L 179.67,139.07 A 12.00 12.00 0 0 1 173.67,149.46 L 106.00,188.54 A 12.00 12.00 0 0 1 94.00,188.54 L 26.33,149.46 A 12.00 12.00 0 0 1 20.33,139.07 L 20.33,60.93 A 12.00 12.00 0 0 1 26.33,50.54 Z" fill="none" stroke="url(#pgRimGrad)" stroke-width="2" filter="url(#pgSoftGlow)" opacity="0.6" />
  <path d="M 94.00,11.46 A 12.00 12.00 0 0 1 106.00,11.46 L 173.67,50.54 A 12.00 12.00 0 0 1 179.67,60.93 L 179.67,139.07 A 12.00 12.00 0 0 1 173.67,149.46 L 106.00,188.54 A 12.00 12.00 0 0 1 94.00,188.54 L 26.33,149.46 A 12.00 12.00 0 0 1 20.33,139.07 L 20.33,60.93 A 12.00 12.00 0 0 1 26.33,50.54 Z" fill="none" stroke="url(#pgRimGrad)" stroke-width="1.5" />

  <!-- Precision Corner Dots -->
  <g fill="#FEF3C7" opacity="0.95">
    <circle cx="100" cy="11" r="1.75" />
    <circle cx="174.67" cy="54" r="1.75" />
    <circle cx="174.67" cy="146" r="1.75" />
    <circle cx="100" cy="189" r="1.75" />
    <circle cx="25.33" cy="146" r="1.75" />
    <circle cx="25.33" cy="54" r="1.75" />
  </g>
</svg>
